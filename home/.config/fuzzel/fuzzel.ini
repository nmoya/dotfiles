[main]
font=JetBrainsMono Nerd Font:size=13
prompt=run:
terminal=alacritty -e
match-mode=fzf
sort-result=yes
show-actions=no
list-executables-in-path=no
lines=12
width=36
horizontal-pad=24
vertical-pad=10
inner-pad=4
icons-enabled=yes

[colors]
background=14161cff
text=e6e6e6ff
